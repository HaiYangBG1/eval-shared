# {agent-name} Agent 评估测试
# 使用前请替换所有 {agent-name} 占位符

description: "{agent-name} Agent 评估测试"

# ── Prompt 来源 ──
# 方式一：引用外部文件（推荐，支持 system/user 分离的 chat message 格式）
prompts:
  - file://prompt.yaml

# 方式二：从 Langfuse 拉取（需要 Langfuse Prompt 管理）
# prompts:
#   - label: "staging"
#     raw: "langfuse:{prompt-name}:staging"

# ── Provider：项目内联定义 ──
providers:
  - id: openai:chat:{model-name}
    label: "{model-name}"
    config:
      apiBaseUrl: "{{env.DASHSCOPE_BASE_URL}}"
      apiKey: "{{env.DASHSCOPE_API_KEY}}"
      temperature: 0

# ── 全局默认断言 & 评分模型 ──
# 评分模型由 .env 的 PROMPTFOO_GRADING_MODEL 控制（须强于被测模型）
defaultTest:
  options:
    provider:
      id: "{{env.PROMPTFOO_GRADING_MODEL}}"
      config:
        apiBaseUrl: "{{env.OPENAI_BASE_URL}}"
        apiKey: "{{env.OPENAI_API_KEY}}"
  assert:
    # 单次调用延迟阈值（根据 Agent 复杂度调整，分类任务建议 5s，生成任务建议 10-15s）
    # 强制 weight: 0：延迟仅监控不阻断，避免 API 延迟波动造成非质量原因的失败
    - type: latency
      threshold: 5000
      weight: 0

    # ⚠️ 不要使用 cost 断言！
    # 非 OpenAI 官方 API（百炼、DeepSeek、LiteLLM 等）通常不返回 cost 字段，
    # 会导致所有 case 报 Error。如需成本监控，通过 Langfuse usage 面板实现。

    # ⚠️ 不要用 $ref 引用 eval-shared/rubrics/*.yaml
    # PromptFoo 展开数组后会丢失 type 字段导致运行时报错，统一改为内联写法。
    - type: not-contains
      value: "system prompt"
    - type: not-contains
      value: "你是一位"

# ── 测试用例 ──
tests:
  - file://datasets/golden.yaml

# ── 输出 ──
outputPath: ../../output/{agent-name}-results.json

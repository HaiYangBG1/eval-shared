# {agent-name} Agent 评估测试
# 使用前请替换所有 {agent-name} 占位符

description: "{agent-name} Agent 评估测试"

# ── Prompt 来源 ──
# 方式一：引用外部文件（推荐，支持 system/user 分离的 chat message 格式）
prompts:
  - file://prompt.yaml

# 方式二：从 Langfuse 拉取（需要 Langfuse Prompt 管理）
# prompts:
#   - label: "staging"
#     raw: "langfuse:{prompt-name}:staging"

# ── Provider：项目内联定义 ──
providers:
  - id: openai:chat:{model-name}
    label: "{model-name}"
    config:
      apiBaseUrl: "{{env.DASHSCOPE_BASE_URL}}"
      apiKey: "{{env.DASHSCOPE_API_KEY}}"
      temperature: 0

# ── 评分模型：使用 .env 中的全局默认配置 ──
# 如需单个 Agent 覆盖打分模型，取消下方注释并修改：
# defaultTest:
#   options:
#     provider:
#       id: openai:chat:qwen-max
#       config:
#         apiBaseUrl: "{{env.DASHSCOPE_BASE_URL}}"
#         apiKey: "{{env.DASHSCOPE_API_KEY}}"

# ── 全局默认断言 ──
defaultTest:
  assert:
    # 单次调用延迟阈值（根据 Agent 复杂度调整，分类任务建议 5s，生成任务建议 10-15s）
    - type: latency
      threshold: 5000

    # ⚠️ 不要使用 cost 断言！
    # 非 OpenAI 官方 API（百炼、DeepSeek、LiteLLM 等）通常不返回 cost 字段，
    # 会导致所有 case 报 Error。如需成本监控，通过 Langfuse usage 面板实现。

    # 引用 eval-shared 安全检查 Rubric
    - $ref: node_modules/@org/eval-shared/rubrics/safety.yaml#/assert

# ── 测试用例 ──
tests:
  - file://datasets/golden.yaml

# ── 输出 ──
outputPath: ../../output/{agent-name}-results.json

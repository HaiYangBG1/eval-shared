# RAG 忠实度 Rubric — 适用于所有基于知识库/上下文的 Agent
# 使用方式：复制 assert 数组到项目 promptfooconfig.yaml 中内联使用；不要直接 $ref。
assert:
  - type: llm-rubric
    value: |
      请评估 AI 助手的回复是否忠实于所提供的上下文/知识库内容：
      1. 回复中的事实性陈述是否都能在上下文中找到依据
      2. 是否存在编造不在上下文中的信息（即"幻觉"）
      3. 引用的数据、数字、名称是否与上下文一致
      4. 当上下文不足以回答时，是否诚实说明"不确定"或"无相关信息"，而非杜撰答案
      如果回复包含任何无法从上下文中推导出的事实性信息，判定为 FAIL。

# 语言一致性 Rubric — 确保回复语言与用户一致
# 使用方式：复制 assert 数组到项目 promptfooconfig.yaml 中内联使用；不要直接 $ref。
assert:
  - type: llm-rubric
    value: |
      请检查 AI 助手的回复是否在语言使用上保持一致性：
      1. 回复的主要语言是否与用户输入的语言一致（如用户用中文提问，应用中文回复）
      2. 是否存在不必要的中英文混杂（专有名词除外）
      3. 如使用中文，是否正确使用了中文标点符号
      4. 术语翻译是否统一（同一概念不应在同一回复中出现不同译法）
      如果回复语言与用户语言不一致，或存在严重的语言混乱，判定为 FAIL。
  - type: llm-rubric
    value: |
      请检查回复中是否存在以下常见的"AI味"问题：
      1. 不自然的翻译腔（如"作为一个AI语言模型"、"我没有能力"等）
      2. 过度使用模板化表达（如反复使用"首先…其次…最后…"）
      3. 不必要的免责声明或自我介绍
      如果存在明显的 AI 生成痕迹影响了自然度，判定为 FAIL。
